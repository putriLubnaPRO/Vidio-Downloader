<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Downloader Free</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center py-10 px-4">

    <!-- Header -->
    <div class="text-center mb-8">
        <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-orange-500">YT Downloader</h1>
        <p class="text-slate-400 mt-2">Download Video & Audio YouTube Gratis</p>
    </div>

    <!-- Main Card -->
    <div class="w-full max-w-lg bg-slate-800 p-6 rounded-2xl shadow-2xl border border-slate-700">
        <input id="ytUrl" type="text" placeholder="Tempel link YouTube di sini..." 
            class="w-full p-4 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-red-500 mb-4 text-sm">
        
        <select id="format" class="w-full p-4 bg-slate-900 border border-slate-700 rounded-xl mb-4 text-sm focus:outline-none">
            <option value="mp4">Video (MP4)</option>
            <option value="mp3">Audio (MP3)</option>
        </select>

        <button onclick="downloadVideo()" id="btnSubmit" 
            class="w-full bg-red-600 hover:bg-red-700 transition py-4 rounded-xl font-bold">
            Ambil Link Download
        </button>
    </div>

    <!-- Result Area -->
    <div id="result" class="hidden w-full max-w-lg mt-6 p-6 bg-slate-800 rounded-2xl border border-slate-700 text-center">
        <p id="statusText" class="text-green-400 font-bold mb-4">Video siap diunduh!</p>
        <a id="downloadLink" href="#" target="_blank" 
            class="block bg-green-600 hover:bg-green-700 py-3 rounded-xl font-bold transition">Download Sekarang</a>
    </div>

    <script>
        async function downloadVideo() {
            const url = document.getElementById('ytUrl').value;
            const format = document.getElementById('format').value;
            const btn = document.getElementById('btnSubmit');
            const resultDiv = document.getElementById('result');
            const downloadLink = document.getElementById('downloadLink');

            if (!url) { alert("Masukkan URL!"); return; }

            btn.innerText = "Memproses...";
            btn.disabled = true;

            try {
                // Menggunakan API Cobalt (Gratis & Public)
                const response = await fetch("https://co.wuk.sh/api/json", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Accept": "application/json" },
                    body: JSON.stringify({
                        url: url,
                        vQuality: "720",
                        isAudioOnly: format === "mp3"
                    })
                });

                const data = await response.json();

                if (data.status === "success" || data.url) {
                    downloadLink.href = data.url;
                    resultDiv.classList.remove('hidden');
                } else {
                    alert("Error: " + (data.text || "Gagal memproses"));
                }
            } catch (err) {
                alert("Terjadi kesalahan koneksi.");
            } finally {
                btn.innerText = "Ambil Link Download";
                btn.disabled = false;
            }
        }
    </script>
</body>
          </html>
