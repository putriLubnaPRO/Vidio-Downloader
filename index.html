<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Downloader Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Header -->
    <div class="text-center mb-6">
        <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-orange-500">
            YT Downloader Pro
        </h1>
        <p class="text-slate-400 mt-1 text-xs">Unduh Video dan Audio YouTube Kualitas Tinggi</p>
    </div>

    <!-- Main Card -->
    <div class="w-full max-w-md bg-slate-800 p-6 rounded-2xl shadow-2xl border border-slate-700">
        
        <!-- Input URL -->
        <div class="mb-4">
            <label class="block text-xs font-semibold text-slate-300 mb-1">URL Video YouTube</label>
            <input id="ytUrl" type="text" placeholder="https://youtu.be/..." 
                class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-red-500 text-sm">
            <p class="text-[10px] text-slate-400 mt-1">*Tempel link video YouTube tunggal di sini</p>
        </div>

        <!-- Tombol Submit -->
        <button onclick="startProcess()" id="btnSubmit" 
            class="w-full bg-red-600 hover:bg-red-700 active:scale-95 transition py-3 rounded-xl font-bold text-sm shadow-lg shadow-red-600/30">
            Ambil Link Download
        </button>

        <!-- Loading Status -->
        <div id="loading" class="hidden mt-4 text-center">
            <p id="loadingStatus" class="text-xs text-yellow-400 animate-pulse">Sedang mengekstrak video...</p>
        </div>
    </div>

    <!-- Result Area -->
    <div id="result" class="hidden w-full max-w-md mt-4 p-5 bg-slate-800 rounded-2xl border border-slate-700 text-center space-y-3">
        <p class="text-green-400 font-bold text-sm">Video Berhasil Ditemukan!</p>
        <p id="videoTitle" class="text-xs text-slate-300 font-semibold line-clamp-2"></p>
        <a id="downloadLink" href="#" target="_blank" rel="noopener noreferrer"
            class="block bg-green-600 hover:bg-green-700 py-3 rounded-xl font-bold text-sm transition shadow-lg shadow-green-600/20">
            Download File MP4
        </a>
    </div>

    <!-- Error Area -->
    <div id="error" class="hidden w-full max-w-md mt-4 p-3 bg-red-900/40 text-red-300 rounded-xl text-xs border border-red-700/50 text-center"></div>

    <script>
        const INVIDIOUS_INSTANCES = [
            "https://inv.tux.pizza/api/v1/videos/",
            "https://invidious.nerdvpn.de/api/v1/videos/",
            "https://vid.puffyan.us/api/v1/videos/"
        ];

        function extractVideoId(url) {
            const regExp = /(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/;
            const match = url.match(regExp);
            return match ? match[1] : null;
        }

        async function startProcess() {
            const ytUrl = document.getElementById("ytUrl").value.trim();
            const btn = document.getElementById("btnSubmit");
            const loading = document.getElementById("loading");
            const resultDiv = document.getElementById("result");
            const errorDiv = document.getElementById("error");
            const downloadLink = document.getElementById("downloadLink");
            const videoTitle = document.getElementById("videoTitle");

            resultDiv.classList.add("hidden");
            errorDiv.classList.add("hidden");

            if (!ytUrl) {
                alert("Silakan isi URL YouTube terlebih dahulu!");
                return;
            }

            const videoId = extractVideoId(ytUrl);
            if (!videoId) {
                errorDiv.innerText = "URL tidak valid. Pastikan link video YouTube biasa!";
                errorDiv.classList.remove("hidden");
                return;
            }

            loading.classList.remove("hidden");
            btn.disabled = true;

            let success = false;

            for (let i = 0; i < INVIDIOUS_INSTANCES.length; i++) {
                try {
                    const response = await fetch(INVIDIOUS_INSTANCES[i] + videoId);
                    if (!response.ok) continue;

                    const data = await response.json();

                    if (data && data.formatStreams && data.formatStreams.length > 0) {
                        const bestStream = data.formatStreams[data.formatStreams.length - 1];
                        videoTitle.innerText = data.title;
                        downloadLink.href = bestStream.url;
                        resultDiv.classList.remove("hidden");
                        success = true;
                        break;
                    }
                } catch (e) {
                    console.warn("Server gagal, mencoba server cadangan...");
                }
            }

            if (!success) {
                errorDiv.innerText = "Gagal mengekstrak video. Coba beberapa saat lagi.";
                errorDiv.classList.remove("hidden");
            }

            loading.classList.add("hidden");
            btn.disabled = false;
        }
    </script>
</body>
    </html>
