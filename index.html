<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Fast Links</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="text-center mb-6">
        <h1 class="text-2xl font-black text-red-500">YT Link Generator</h1>
        <p class="text-slate-400 text-xs">Anti Blokir (No API Fetching)</p>
    </div>

    <div class="w-full max-w-md bg-slate-800 p-6 rounded-2xl border border-slate-700">
        <input id="ytUrl" type="text" placeholder="Tempel link YouTube di sini..." 
            class="w-full p-3 mb-4 bg-slate-900 border border-slate-700 rounded-xl focus:border-red-500 outline-none text-sm">
        
        <button onclick="generateLinks()" 
            class="w-full bg-red-600 py-3 rounded-xl font-bold text-sm hover:bg-red-700 transition">
            Generate Link Download
        </button>
    </div>

    <div id="result" class="hidden w-full max-w-md mt-4 p-5 bg-slate-800 rounded-2xl border border-slate-700 space-y-3 text-center">
        <p class="text-xs text-slate-300">Pilih salah satu link di bawah:</p>
        <a id="btn1" href="#" target="_blank" class="block bg-slate-700 py-3 rounded-xl text-sm font-semibold hover:bg-slate-600">Download via SsYouTube</a>
        <a id="btn2" href="#" target="_blank" class="block bg-slate-700 py-3 rounded-xl text-sm font-semibold hover:bg-slate-600">Download via Y2Mate</a>
    </div>

    <script>
        function generateLinks() {
            const url = document.getElementById("ytUrl").value.trim();
            const idMatch = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
            
            if (!idMatch) {
                alert("Link tidak valid!");
                return;
            }

            const id = idMatch[1];
            // Link langsung tanpa API background
            document.getElementById("btn1").href = "https://ssyoutube.com/watch?v=" + id;
            document.getElementById("btn2").href = "https://y2mate.is/en/download?url=https://www.youtube.com/watch?v=" + id;
            
            document.getElementById("result").classList.remove("hidden");
        }
    </script>
</body>
</html>
