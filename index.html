<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Direct Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Header -->
    <div class="text-center mb-6">
        <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-orange-500">
            YT Downloader Direct
        </h1>
        <p class="text-slate-400 mt-1 text-xs">Download Langsung File MP4 & MP3 Ke Perangkat</p>
    </div>

    <!-- Main Card -->
    <div class="w-full max-w-md bg-slate-800 p-6 rounded-2xl shadow-2xl border border-slate-700">
        
        <!-- Input URL -->
        <div class="mb-4">
            <label class="block text-xs font-semibold text-slate-300 mb-1">URL Video YouTube</label>
            <input id="ytUrl" type="text" placeholder="Tempel link YouTube di sini..." 
                class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-red-500 text-sm">
        </div>

        <!-- Opsi Format -->
        <div class="mb-5">
            <label class="block text-xs font-semibold text-slate-300 mb-1">Format File</label>
            <select id="formatType" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:outline-none focus:border-red-500">
                <option value="mp4">Video MP4 (720p HD)</option>
                <option value="mp3">Audio MP3 (Suara Saja)</option>
            </select>
        </div>

        <!-- Tombol Download Direct -->
        <button onclick="startDirectDownload()" id="btnSubmit" 
            class="w-full bg-red-600 hover:bg-red-700 active:scale-95 transition py-3 rounded-xl font-bold text-sm shadow-lg shadow-red-600/30">
            Download File Sekarang
        </button>

        <!-- Status Loading -->
        <div id="loading" class="hidden mt-4 text-center">
            <p id="loadingText" class="text-xs text-yellow-400 animate-pulse">Sedang menyiapkan file download...</p>
        </div>
    </div>

    <!-- Error Area -->
    <div id="error" class="hidden w-full max-w-md mt-4 p-3 bg-red-900/40 text-red-300 rounded-xl text-xs border border-red-700/50 text-center"></div>

    <script>
        function extractVideoId(url) {
            const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
            return match ? match[1] : null;
        }

        async function startDirectDownload() {
            const ytUrl = document.getElementById("ytUrl").value.trim();
            const format = document.getElementById("formatType").value;
            const btn = document.getElementById("btnSubmit");
            const loading = document.getElementById("loading");
            const errorDiv = document.getElementById("error");

            errorDiv.classList.add("hidden");

            const videoId = extractVideoId(ytUrl);
            if (!videoId) {
                errorDiv.innerText = "URL YouTube tidak valid. Masukkan link video biasa.";
                errorDiv.classList.remove("hidden");
                return;
            }

            loading.classList.remove("hidden");
            btn.disabled = true;

            const cleanYtUrl = "https://www.youtube.com/watch?v=" + videoId;
            
            // Server API Direct Stream
            const apiEndpoints = [
                `https://api.vevioz.com/api/button/${format}/${videoId}`,
                `https://yt1s.com.co/api/ajaxSearch/index`
            ];

            try {
                // Mengarahkan browser langsung mengunduh/memicu file download
                if (format === "mp3") {
                    window.location.href = `https://api.vevioz.com/api/button/mp3/${videoId}`;
                } else {
                    window.location.href = `https://api.vevioz.com/api/button/videos/${videoId}`;
                }
            } catch (err) {
                errorDiv.innerText = "Gagal memicu download otomatis. Coba sekali lagi.";
                errorDiv.classList.remove("hidden");
            } finally {
                setTimeout(() => {
                    loading.classList.add("hidden");
                    btn.disabled = false;
                }, 3000);
            }
        }
    </script>
</body>
</html>
