<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Downloader Pro Anti Gagal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Header -->
    <div class="text-center mb-6">
        <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-orange-500">
            YT Downloader Pro
        </h1>
        <p class="text-slate-400 mt-1 text-xs">Sistem Multi Engine Anti Error</p>
    </div>

    <!-- Main Card -->
    <div class="w-full max-w-md bg-slate-800 p-6 rounded-2xl shadow-2xl border border-slate-700">
        
        <!-- Input URL -->
        <div class="mb-4">
            <label class="block text-xs font-semibold text-slate-300 mb-1">URL Video YouTube</label>
            <input id="ytUrl" type="text" placeholder="Tempel link YouTube di sini..." 
                class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-red-500 text-sm">
        </div>

        <!-- Tombol Submit -->
        <button onclick="processVideo()" id="btnSubmit" 
            class="w-full bg-red-600 hover:bg-red-700 active:scale-95 transition py-3 rounded-xl font-bold text-sm shadow-lg shadow-red-600/30">
            Ekstrak Video Instan
        </button>
    </div>

    <!-- Result Area -->
    <div id="result" class="hidden w-full max-w-md mt-4 p-5 bg-slate-800 rounded-2xl border border-slate-700 text-center space-y-3">
        <p class="text-green-400 font-bold text-sm">Pilih Server Download:</p>
        
        <div class="space-y-2">
            <a id="link1" target="_blank" rel="noopener noreferrer"
                class="block bg-red-600 hover:bg-red-700 py-3 rounded-xl font-bold text-xs transition">
                Server 1 - Y2Mate Direct
            </a>
            <a id="link2" target="_blank" rel="noopener noreferrer"
                class="block bg-blue-600 hover:bg-blue-700 py-3 rounded-xl font-bold text-xs transition">
                Server 2 - SSYouTube MP4
            </a>
            <a id="link3" target="_blank" rel="noopener noreferrer"
                class="block bg-emerald-600 hover:bg-emerald-700 py-3 rounded-xl font-bold text-xs transition">
                Server 3 - Y2Mate IS Engine
            </a>
        </div>
    </div>

    <!-- Error Area -->
    <div id="error" class="hidden w-full max-w-md mt-4 p-3 bg-red-900/40 text-red-300 rounded-xl text-xs border border-red-700/50 text-center"></div>

    <script>
        function extractId(url) {
            const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
            return match ? match[1] : null;
        }

        function processVideo() {
            const url = document.getElementById("ytUrl").value.trim();
            const resultDiv = document.getElementById("result");
            const errorDiv = document.getElementById("error");

            resultDiv.classList.add("hidden");
            errorDiv.classList.add("hidden");

            const id = extractId(url);
            if (!id) {
                errorDiv.innerText = "URL YouTube tidak valid.";
                errorDiv.classList.remove("hidden");
                return;
            }

            document.getElementById("link1").href = "https://www.y2mate.com/youtube/" + id;
            document.getElementById("link2").href = "https://ssyoutube.com/watch?v=" + id;
            document.getElementById("link3").href = "https://y2mate.is/en/download?url=" + encodeURIComponent(url);

            resultDiv.classList.remove("hidden");
        }
    </script>
</body>
</html>
