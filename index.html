<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Downloader Pro Direct</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Header -->
    <div class="text-center mb-6">
        <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-orange-500">
            YT Downloader Pro
        </h1>
        <p class="text-slate-400 mt-1 text-xs">Direct Download MP4 & MP3 untuk GitHub Pages</p>
    </div>

    <!-- Main Card -->
    <div class="w-full max-w-md bg-slate-800 p-6 rounded-2xl shadow-2xl border border-slate-700">
        
        <!-- Input URL -->
        <div class="mb-4">
            <label class="block text-xs font-semibold text-slate-300 mb-1">URL Video YouTube</label>
            <input id="ytUrl" type="text" placeholder="https://youtu.be/..." 
                class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-red-500 text-sm">
        </div>

        <!-- Format Selector -->
        <div class="mb-5">
            <label class="block text-xs font-semibold text-slate-300 mb-1">Pilih Format</label>
            <select id="format" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:outline-none focus:border-red-500">
                <option value="mp4">Video MP4 (HD)</option>
                <option value="mp3">Audio MP3 (Suara saja)</option>
            </select>
        </div>

        <!-- Tombol Submit -->
        <button onclick="startProcess()" id="btnSubmit" 
            class="w-full bg-red-600 hover:bg-red-700 active:scale-95 transition py-3 rounded-xl font-bold text-sm shadow-lg shadow-red-600/30">
            Proses & Download
        </button>

        <!-- Loading -->
        <div id="loading" class="hidden mt-4 text-center">
            <p class="text-xs text-yellow-400 animate-pulse">Sedang menyiapkan file unduhan...</p>
        </div>
    </div>

    <!-- Result Area -->
    <div id="result" class="hidden w-full max-w-md mt-4 p-5 bg-slate-800 rounded-2xl border border-slate-700 text-center space-y-3">
        <p class="text-green-400 font-bold text-sm">File Siap Diunduh!</p>
        <p id="videoTitle" class="text-xs text-slate-300 font-semibold line-clamp-2"></p>
        <a id="downloadBtn" href="#" target="_blank" download
            class="block bg-green-600 hover:bg-green-700 py-3 rounded-xl font-bold text-sm transition shadow-lg shadow-green-600/20">
            Klik Untuk Simpan File
        </a>
    </div>

    <!-- Error Area -->
    <div id="error" class="hidden w-full max-w-md mt-4 p-3 bg-red-900/40 text-red-300 rounded-xl text-xs border border-red-700/50 text-center"></div>

    <script>
        function extractId(url) {
            const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
            return match ? match[1] : null;
        }

        async function startProcess() {
            const url = document.getElementById("ytUrl").value.trim();
            const format = document.getElementById("format").value;
            const btn = document.getElementById("btnSubmit");
            const loading = document.getElementById("loading");
            const resultDiv = document.getElementById("result");
            const errorDiv = document.getElementById("error");
            const downloadBtn = document.getElementById("downloadBtn");
            const videoTitle = document.getElementById("videoTitle");

            resultDiv.classList.add("hidden");
            errorDiv.classList.add("hidden");

            const id = extractId(url);
            if (!id) {
                errorDiv.innerText = "Masukkan link video YouTube yang valid!";
                errorDiv.classList.remove("hidden");
                return;
            }

            loading.classList.remove("hidden");
            btn.disabled = true;

            try {
                // API FabDL Active Engine
                const response = await fetch(`https://api.fabdl.com/youtube/get?url=${encodeURIComponent("https://www.youtube.com/watch?v=" + id)}`);
                const data = await response.json();

                if (data && data.result) {
                    const ticket = data.result.ticket;
                    const gid = data.result.id;
                    videoTitle.innerText = data.result.title || "Video YouTube";

                    // Mengambil link konversi langsung
                    const convertRes = await fetch(`https://api.fabdl.com/youtube/mp3-convert/${gid}/${ticket}`);
                    const convertData = await convertRes.json();

                    if (convertData && convertData.result && convertData.result.download_url) {
                        downloadBtn.href = "https://api.fabdl.com" + convertData.result.download_url;
                        resultDiv.classList.remove("hidden");
                    } else {
                        throw new Error("Gagal mengambil file stream.");
                    }
                } else {
                    throw new Error("Video tidak ditemukan.");
                }
            } catch (err) {
                // Jalur Cadangan Instan jika API utama sibuk
                const cleanYtUrl = "https://www.youtube.com/watch?v=" + id;
                videoTitle.innerText = "Klik tombol hijau di bawah untuk mengunduh langsung:";
                downloadBtn.href = format === "mp3" 
                    ? `https://y2mate.is/en/download?url=${encodeURIComponent(cleanYtUrl)}` 
                    : `https://ssyoutube.com/watch?v=${id}`;
                resultDiv.classList.remove("hidden");
            } finally {
                loading.classList.add("hidden");
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
