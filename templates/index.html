<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Direct Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Header -->
    <div class="text-center mb-6">
        <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-orange-500">
            YT Direct Downloader
        </h1>
        <p class="text-slate-400 mt-1 text-xs">Langsung Simpan ke Galeri / Downloads</p>
    </div>

    <!-- Main Form -->
    <div class="w-full max-w-md bg-slate-800 p-6 rounded-2xl shadow-2xl border border-slate-700">
        
        <form action="/download" method="GET" onsubmit="showLoading()">
            <!-- Input URL -->
            <div class="mb-4">
                <label class="block text-xs font-semibold text-slate-300 mb-1">URL Video YouTube</label>
                <input name="url" type="text" required placeholder="https://youtu.be/..." 
                    class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-red-500 text-sm">
            </div>

            <!-- Select Format -->
            <div class="mb-5">
                <label class="block text-xs font-semibold text-slate-300 mb-1">Pilih Format</label>
                <select name="format" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:outline-none focus:border-red-500">
                    <option value="mp4">Video MP4 (HD)</option>
                    <option value="mp3">Audio MP3 (Suara Saja)</option>
                </select>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="btnSubmit" 
                class="w-full bg-red-600 hover:bg-red-700 active:scale-95 transition py-3 rounded-xl font-bold text-sm shadow-lg shadow-red-600/30">
                Download Langsung
            </button>
        </form>

        <!-- Loading Notice -->
        <div id="loading" class="hidden mt-4 text-center">
            <p class="text-xs text-yellow-400 animate-pulse">Sedang mengunduh file, tunggu sebentar...</p>
        </div>
    </div>

    <script>
        function showLoading() {
            document.getElementById("loading").classList.remove("hidden");
        }
    </script>
</body>
  </html>
